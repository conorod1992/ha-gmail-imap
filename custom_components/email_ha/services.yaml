find_emails:
  name: Find emails
  description: >
    Find emails with friendly filters. Blank filters are ignored and all filled
    conditions must match. Gmail performs the search on its server.
  target: {}
  fields:
    config_entry_id:
      name: Account
      description: Select the Gmail account. Required when multiple accounts are configured.
      required: false
      selector:
        config_entry:
          integration: email_ha
    folder:
      name: Folder
      description: Defaults to Inbox. Advanced users may enter another IMAP folder.
      default: INBOX
      example: INBOX
      selector:
        text: {}
    from:
      name: From contains
      description: "Match sender name or email address. Example: rsa.ie"
      example: rsa.ie
      selector:
        text: {}
    subject:
      name: Subject contains
      description: "Match text in the subject. Example: booking"
      example: booking
      selector:
        text: {}
    read_state:
      name: Read state
      description: Match any email, unread email, or read email.
      default: any
      selector:
        select:
          options:
            - label: Any
              value: any
            - label: Unread
              value: unread
            - label: Read
              value: read
    starred_state:
      name: Starred state
      description: Optionally require emails to be starred or not starred.
      default: any
      selector:
        select:
          options:
            - label: Any
              value: any
            - label: Starred
              value: starred
            - label: Not starred
              value: not_starred
    important_state:
      name: Gmail importance
      description: Optionally match Gmail's Important classification.
      default: any
      selector:
        select:
          options:
            - label: Any
              value: any
            - label: Important
              value: important
            - label: Not important
              value: not_important
    gmail_category:
      name: Gmail category
      description: Optionally match Gmail's Primary, Updates, Promotions, Social, or Forums classification.
      default: any
      selector:
        select:
          options:
            - label: Any
              value: any
            - label: Primary
              value: primary
            - label: Updates
              value: updates
            - label: Promotions
              value: promotions
            - label: Social
              value: social
            - label: Forums
              value: forums
    attachment_state:
      name: Attachment
      description: Optionally require an attachment or require no attachment.
      default: any
      selector:
        select:
          options:
            - label: Any
              value: any
            - label: Has attachment
              value: has_attachment
            - label: No attachment
              value: no_attachment
    more_filters:
      collapsed: true
      fields:
        to:
          name: To contains
          description: Match a recipient name or email address in the To header.
          example: home@example.com
          selector:
            text: {}
        cc:
          name: CC contains
          description: Match a recipient name or email address in the CC header.
          example: accounts@example.com
          selector:
            text: {}
        body:
          name: Body contains
          description: Search body text on Gmail's server without downloading every message into Home Assistant.
          example: confirmation number
          selector:
            text: {}
        text:
          name: Any text contains
          description: Search message headers and body text on Gmail's server.
          example: Dublin
          selector:
            text: {}
        attachment_filename:
          name: Attachment filename contains
          description: Match attachment filenames using Gmail's server-side search without downloading attachments.
          example: pdf
          selector:
            text: {}
        since:
          name: Since
          description: Match emails on or after this date.
          selector:
            date: {}
        before:
          name: Before
          description: Match emails before this date.
          selector:
            date: {}
        "on":
          name: "On"
          description: Match emails on this date.
          selector:
            date: {}
    result_options:
      collapsed: true
      fields:
        max_results:
          name: Maximum results
          description: Maximum number of newest matching emails to return, from 1 to 25.
          default: 10
          selector:
            number:
              min: 1
              max: 25
              mode: box
        include_body:
          name: Include body
          description: Also retrieve bounded readable email text. This may expose private message content to the automation.
          default: false
          selector:
            boolean: {}
        body_max_chars:
          name: Body character limit
          description: Maximum readable body characters returned per email. Used only when Include body is enabled.
          default: 4000
          selector:
            number:
              min: 1
              max: 20000
              mode: box

search_emails:
  name: "Advanced: Search using IMAP query"
  description: >
    Search using raw IMAP SEARCH criteria. This is for advanced users; most
    automations should use Find emails.
  target: {}
  fields:
    config_entry_id:
      name: Account
      description: Select the Gmail account. Required when multiple accounts are configured.
      required: false
      selector:
        config_entry:
          integration: email_ha
    folder:
      name: Folder
      description: IMAP folder to search. UIDs are only valid in this folder.
      default: INBOX
      example: INBOX
      selector:
        text: {}
    search_criteria:
      name: IMAP search criteria
      description: 'Standard IMAP criteria, not Gmail web syntax. Example: UNSEEN FROM "person@example.com"'
      default: ALL
      example: 'UNSEEN FROM "person@example.com"'
      selector:
        text: {}
    max_results:
      name: Maximum results
      description: Maximum number of newest matching emails to return, from 1 to 25.
      default: 10
      selector:
        number:
          min: 1
          max: 25
          mode: box
    include_body:
      name: Include body
      description: Also retrieve bounded readable email text. This may expose private message content to the automation.
      default: false
      selector:
        boolean: {}
    body_max_chars:
      name: Body character limit
      description: Maximum readable body characters returned per email.
      default: 4000
      selector:
        number:
          min: 1
          max: 20000
          mode: box

get_email_contents:
  name: Get email contents
  description: >
    Retrieve bounded readable content for one email. Use the email UID returned
    by Find emails or the New email event.
  target: {}
  fields:
    config_entry_id:
      name: Account
      description: Select the Gmail account. Required when multiple accounts are configured.
      required: false
      selector:
        config_entry:
          integration: email_ha
    folder:
      name: Folder
      description: Folder containing the email UID. UIDs are folder-specific.
      default: INBOX
      example: INBOX
      selector:
        text: {}
    uid:
      name: Email UID
      description: Use the UID returned by Find emails or the New email event.
      example: "12345"
      required: true
      selector:
        text: {}
    body_max_chars:
      name: Body character limit
      description: Maximum readable body characters to return, from 1 to 20000.
      default: 12000
      selector:
        number:
          min: 1
          max: 20000
          mode: box
