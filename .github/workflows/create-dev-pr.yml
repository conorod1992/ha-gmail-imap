name: Create/Update Dev PR

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate PR body and title type from commits
        id: commits
        run: |
          BODY=$(git log origin/main..HEAD --pretty=format:"  - %s" --reverse)
          if [ -z "$BODY" ]; then
            BODY="  - (no commits ahead of main)"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          SUBJECTS=$(git log origin/main..HEAD --pretty=format:"%s" --reverse)

          TITLE=$(echo "$SUBJECTS" | grep -iE "^feat(\(.+\))?!?:" | tail -1)
          if [ -z "$TITLE" ]; then
            TITLE=$(echo "$SUBJECTS" | grep -iE "^fix(\(.+\))?!?:" | tail -1)
          fi
          if [ -z "$TITLE" ]; then
            TITLE=$(echo "$SUBJECTS" | tail -1)
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Find or create draft PR when permitted
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BODY: ${{ steps.commits.outputs.body }}
          TITLE: ${{ steps.commits.outputs.title }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number' \
            --repo "$GITHUB_REPOSITORY")

          if [ -z "$PR_NUMBER" ]; then
            if gh pr create \
              --draft \
              --title "$TITLE" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH" \
              --repo "$GITHUB_REPOSITORY"; then
              PR_NUMBER=$(gh pr list \
                --head "$BRANCH" \
                --base main \
                --state open \
                --json number \
                --jq '.[0].number' \
                --repo "$GITHUB_REPOSITORY")
            else
              echo "::notice title=Automatic PR creation unavailable::GitHub Actions is not permitted to create pull requests for this repository. The branch push is valid; create the PR manually or enable 'Allow GitHub Actions to create and approve pull requests' in repository Actions settings."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "PR #$PR_NUMBER already exists; preserving its title and body"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  label:
    runs-on: ubuntu-latest
    needs: create-or-update-pr
    if: ${{ needs.create-or-update-pr.outputs.pr_number != '' }}
    steps:
      - name: Apply label from PR title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ needs.create-or-update-pr.outputs.pr_number }}"
          TITLE=$(gh pr view "$PR_NUMBER" --json title -q '.title' --repo "$GITHUB_REPOSITORY")

          if echo "$TITLE" | grep -qiE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)(\(.+\))?!:'; then
            LABEL="!feature"
          elif echo "$TITLE" | grep -qiE '^feat(\(.+\))?:'; then
            LABEL="feature"
          elif echo "$TITLE" | grep -qiE '^fix(\(.+\))?:'; then
            LABEL="fix"
          elif echo "$TITLE" | grep -qiE '^(chore|docs|refactor|perf|test|build|ci|style|revert)(\(.+\))?:'; then
            LABEL="chore"
          else
            echo "No matching label for: $TITLE"
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --add-label "$LABEL" --repo "$GITHUB_REPOSITORY"
