name: PR Label & Version Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    steps:
      - name: Set PR title from highest semantic commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEST=""
          PRIORITY=0

          while IFS= read -r subject; do
            if echo "$subject" | grep -qiE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)(\(.+\))?!:'; then
              if [ $PRIORITY -lt 4 ]; then PRIORITY=4; BEST="$subject"; fi
            elif echo "$subject" | grep -qiE '^feat(\(.+\))?:'; then
              if [ $PRIORITY -lt 3 ]; then PRIORITY=3; BEST="$subject"; fi
            elif echo "$subject" | grep -qiE '^fix(\(.+\))?:'; then
              if [ $PRIORITY -lt 2 ]; then PRIORITY=2; BEST="$subject"; fi
            elif echo "$subject" | grep -qiE '^(chore|docs|refactor|perf|test|build|ci|style|revert)(\(.+\))?:'; then
              if [ $PRIORITY -lt 1 ]; then PRIORITY=1; BEST="$subject"; fi
            fi
          done < <(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits --jq '.[].commit.message | split("\n")[0]')

          if [ -n "$BEST" ]; then
            gh pr edit ${{ github.event.pull_request.number }} --title "$BEST" --repo ${{ github.repository }}
          else
            echo "::error::No conventional commit found (feat:, fix:, chore:, etc.). Add a semantic prefix to at least one commit."
            exit 1
          fi

  label:
    runs-on: ubuntu-latest
    needs: update-title
    if: always() && (needs.update-title.result == 'success' || needs.update-title.result == 'skipped')
    steps:
      - name: Apply label from PR title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q '.title' --repo ${{ github.repository }})

          if echo "$TITLE" | grep -qiE '^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)(\(.+\))?!:'; then
            LABEL="!feature"
          elif echo "$TITLE" | grep -qiE '^feat(\(.+\))?:'; then
            LABEL="feature"
          elif echo "$TITLE" | grep -qiE '^fix(\(.+\))?:'; then
            LABEL="fix"
          elif echo "$TITLE" | grep -qiE '^(chore|docs|refactor|perf|test|build|ci|style|revert)(\(.+\))?:'; then
            LABEL="chore"
          else
            echo "No matching label for: $TITLE"
            exit 0
          fi

          gh pr edit ${{ github.event.pull_request.number }} --add-label "$LABEL" --repo ${{ github.repository }}

  check-version:
    name: Keep release version unchanged in development PRs
    runs-on: ubuntu-latest
    needs: label
    if: always() && needs.label.result == 'success'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify manifest version is release-owned
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "$BASE_REF"
          BASE_VERSION="$(git show "origin/$BASE_REF:custom_components/email_ha/manifest.json" | jq -r '.version')"
          PR_VERSION="$(jq -r '.version' custom_components/email_ha/manifest.json)"

          echo "Base version: $BASE_VERSION"
          echo "PR version: $PR_VERSION"

          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "Manifest version is unchanged. The Release workflow owns version bumps."
            exit 0
          fi

          MSG="<!-- version-check -->
          ⚠️ **Do not bump \`custom_components/email_ha/manifest.json\` in development PRs.**

          The manual **Release** workflow now owns release version changes. Revert the manifest version to \`$BASE_VERSION\`; when the merged code is ready to publish, run the Release workflow and enter the target \`X.Y.Z\` version there.

          This keeps feature/fix PRs independent from release timing and prevents merge conflicts between parallel PRs."

          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | contains("<!-- version-check -->")) | select(.user.type == "Bot") | .id' | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -f body="$MSG"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "$MSG" --repo ${{ github.repository }}
          fi

          exit 1
