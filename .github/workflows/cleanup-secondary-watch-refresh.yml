name: Clean secondary watch refresh branch

on:
  push:
    branches:
      - fix/secondary-watch-refresh

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/secondary-watch-refresh
      - name: Remove duplicated helper and cleanup workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/email_ha/coordinator.py')
          text = path.read_text()
          helper = '''def _coordinator_refresh_interval(\n    monitored_folder: str, email_watches: list[dict[str, Any]]\n) -> timedelta:\n    """Return a shorter fallback interval when IDLE cannot cover every watch."""\n    has_secondary_watch = any(\n        watch.get("enabled", True)\n        and str(watch.get("folder", DEFAULT_FOLDER)) != monitored_folder\n        for watch in email_watches\n    )\n    seconds = (\n        _SECONDARY_WATCH_REFRESH_INTERVAL\n        if has_secondary_watch\n        else IDLE_FALLBACK_REFRESH_INTERVAL\n    )\n    return timedelta(seconds=seconds)\n\n\n'''
          while helper + helper in text:
              text = text.replace(helper + helper, helper)
          path.write_text(text)
          PY
          git rm .github/workflows/cleanup-secondary-watch-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/email_ha/coordinator.py
          git commit -m "fix: deduplicate secondary watch refresh helper"
          git push
