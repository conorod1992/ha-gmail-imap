name: Apply match mode implementation v4

on:
  push:
    branches:
      - feature/match-all-any-filters

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/match-all-any-filters
      - name: Apply and tidy implementation
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-match-mode-v2.yml').read_text()
          marker = '      - name: Apply implementation\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('      - name: Install test dependencies\n', start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'match_mode_patch.py', 'exec'))

          search = Path('custom_components/email_ha/search.py')
          text = search.read_text()
          old = '''    normalized = normalize_structured_filters(filters)\n    if normalized.pop("match_mode", "all") == "any":\n        clauses = [\n            build_structured_search_tokens({field: value}, current_date=current_date)\n            for field, value in normalized.items()\n        ]\n        if not clauses:\n            return ["ALL"]\n        if len(clauses) == 1:\n            return clauses[0]\n\n        def grouped(clause: Sequence[str]) -> str:\n            return clause[0] if len(clause) == 1 else f"({' '.join(clause)})"\n\n        combined = clauses[-1]\n        for clause in reversed(clauses[:-1]):\n            combined = ["OR", grouped(clause), grouped(combined)]\n        return validate_search_tokens(combined)\n\n    tokens: list[str] = []\n'''
          new = '''    normalized = normalize_structured_filters(filters)\n    if normalized.pop("match_mode", "all") == "any":\n        return _build_any_search_tokens(normalized, current_date=current_date)\n\n    tokens: list[str] = []\n'''
          if old not in text:
              raise RuntimeError('Could not locate match-any block')
          text = text.replace(old, new, 1)
          marker2 = 'def build_structured_search_tokens(\n'
          helper = '''def _build_any_search_tokens(\n    filters: Mapping[str, Any], *, current_date: date | None = None\n) -> list[str]:\n    """Build a nested IMAP OR expression from independent structured conditions."""\n    clauses = [\n        build_structured_search_tokens({field: value}, current_date=current_date)\n        for field, value in filters.items()\n    ]\n    if not clauses:\n        return ["ALL"]\n    if len(clauses) == 1:\n        return clauses[0]\n\n    def grouped(clause: Sequence[str]) -> str:\n        return clause[0] if len(clause) == 1 else f"({' '.join(clause)})"\n\n    combined = clauses[-1]\n    for clause in reversed(clauses[:-1]):\n        combined = ["OR", grouped(clause), grouped(combined)]\n    return validate_search_tokens(combined)\n\n\n'''
          if marker2 not in text:
              raise RuntimeError('Could not locate search builder')
          search.write_text(text.replace(marker2, helper + marker2, 1))

          tests = Path('tests/test_match_mode.py')
          test_text = tests.read_text()
          tests.write_text(test_text.replace('"""Tests for Match all / Match any structured filters."""\n', '"""Tests for Match all / Match any structured filters."""\n\n# ruff: noqa: D103\n', 1))

          for path_name in ('custom_components/email_ha/strings.json', 'custom_components/email_ha/translations/en.json'):
              path = Path(path_name)
              value = path.read_text().replace('All conditions requires every filled filter to match.', 'All conditions require every filled filter to match.')
              path.write_text(value)
      - name: Format and lint
        run: |
          python -m pip install ruff
          ruff format custom_components tests
          ruff check custom_components tests
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md custom_components tests
          git commit -m "feat: support match all or any filters"
          git push origin HEAD:feature/match-all-any-filters
