# Temporary branch-only patch runner; removes itself after applying the fix.
name: Apply watch baseline retry fix

on:
  push:
    branches:
      - fix/watch-baseline-retry

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch coordinator and regression test
        shell: python
        run: |
          from pathlib import Path

          coordinator_path = Path("custom_components/email_ha/coordinator.py")
          text = coordinator_path.read_text()

          old_prepare = '''            if (
                previous is not None
                and previous[0] == fingerprint
                and previous[1] == uid_validity
            ):
                floors[watch_id] = previous[2]
                highest_uid = max(highest_uid, previous[2])
            else:
                # A new/materially changed watch must never inherit older arrivals
                # fetched for another watch sharing the same folder.
                floors[watch_id] = highest_uid
            state[watch_id] = (fingerprint, uid_validity, highest_uid)
'''
          new_prepare = '''            if (
                previous is not None
                and previous[0] == fingerprint
                and previous[1] == uid_validity
            ):
                # Existing watches acknowledge a UID only after their filter query
                # succeeds. Keeping the old floor here lets a failed query retry.
                floors[watch_id] = previous[2]
            else:
                # A new/materially changed watch must never inherit older arrivals
                # fetched for another watch sharing the same folder.
                floors[watch_id] = highest_uid
                state[watch_id] = (fingerprint, uid_validity, highest_uid)
'''
          if old_prepare not in text:
              raise SystemExit("prepare-watch snippet not found")
          text = text.replace(old_prepare, new_prepare, 1)

          old_match = '''                matching_uids = await client.matching_uids(
                    folder,
                    [str(message.get("uid", "")) for message in candidate_messages],
                    tokens,
                )
                if is_watch:
                    self._set_rule_success(definition_id, checked_at=observed_at)
                for message in candidate_messages:
'''
          new_match = '''                matching_uids = await client.matching_uids(
                    folder,
                    [str(message.get("uid", "")) for message in candidate_messages],
                    tokens,
                )
                if is_watch:
                    self._set_rule_success(definition_id, checked_at=observed_at)
                    watch_state = self._watch_uid_state.get(definition_id)
                    if watch_state is not None:
                        acknowledged_uid = max(
                            int(str(message["uid"])) for message in candidate_messages
                        )
                        self._watch_uid_state[definition_id] = (
                            watch_state[0],
                            watch_state[1],
                            max(watch_state[2], acknowledged_uid),
                        )
                for message in candidate_messages:
'''
          if old_match not in text:
              raise SystemExit("match-success snippet not found")
          text = text.replace(old_match, new_match, 1)

          old_except = '''            except (ImapClientError, ValueError) as err:
                if is_watch:
                    self._set_rule_error(
                        definition_id,
                        err,
                        "Email watch query failed",
                    )
                _LOGGER.warning(
                    "Unable to match filtered definition %s for %s: %s",
                    definition_id,
                    self._email,
                    type(err).__name__,
                )
'''
          new_except = '''            except (ImapClientError, ValueError) as err:
                if is_watch:
                    self._set_rule_error(
                        definition_id,
                        err,
                        "Email watch query failed",
                    )
                    if isinstance(err, ImapClientError):
                        watch_state = self._watch_uid_state.get(definition_id)
                        folder_state = self._folder_uid_state.get(folder)
                        if (
                            watch_state is not None
                            and folder_state is not None
                            and watch_state[1] == folder_state[0]
                        ):
                            # The folder high-water mark is shared by all watches.
                            # Roll it back to this failed watch's unacknowledged floor
                            # so its arrivals are fetched again on the next refresh.
                            self._folder_uid_state[folder] = (
                                folder_state[0],
                                min(folder_state[1], watch_state[2]),
                            )
                _LOGGER.warning(
                    "Unable to match filtered definition %s for %s: %s",
                    definition_id,
                    self._email,
                    type(err).__name__,
                )
'''
          if old_except not in text:
              raise SystemExit("match-error snippet not found")
          text = text.replace(old_except, new_except, 1)
          coordinator_path.write_text(text)

          test_path = Path("tests/test_catch_up.py")
          tests = test_path.read_text()
          import_anchor = "from custom_components.email_ha.coordinator import (\n    EmailDataUpdateCoordinator,\n    watch_definition_fingerprint,\n)\n"
          import_replacement = import_anchor + "from custom_components.email_ha.imap_client import ImapClientError\n"
          if import_anchor not in tests:
              raise SystemExit("test import anchor not found")
          tests = tests.replace(import_anchor, import_replacement, 1)

          regression = r'''

@pytest.mark.asyncio
async def test_watch_match_failure_retries_unacknowledged_arrival() -> None:
    """A transient watch query failure retries the same UID on the next refresh."""
    coordinator = _coordinator()
    watch = {
        "id": "watch",
        "name": "Watch",
        "folder": "Receipts",
        "enabled": True,
        "filters": {"from": "example.com"},
    }
    coordinator.email_watches = [watch]
    fingerprint = watch_definition_fingerprint(watch)
    coordinator._folder_uid_state["Receipts"] = (9, 100)  # noqa: SLF001
    coordinator._watch_uid_state["watch"] = (fingerprint, 9, 100)  # noqa: SLF001

    client = AsyncMock()
    client.get_new_emails.return_value = ([_message("101")], 1)
    status = {"uidvalidity": 9, "uidnext": 102}

    first_arrivals = await coordinator._async_detect_folder_new_emails(  # noqa: SLF001
        client,
        "Receipts",
        status,
        fetch_messages=True,
    )
    first_floors = coordinator._prepare_watch_uid_floors(  # noqa: SLF001
        {"Receipts": status}
    )
    assert first_floors == {"watch": 100}
    assert coordinator._watch_uid_state["watch"] == (fingerprint, 9, 100)  # noqa: SLF001

    client.matching_uids.side_effect = ImapClientError("temporary failure")
    matches = await coordinator._async_match_new_messages(  # noqa: SLF001
        client,
        {"Receipts": first_arrivals},
        watch_uid_floors=first_floors,
    )
    assert matches == []
    assert coordinator._folder_uid_state["Receipts"] == (9, 100)  # noqa: SLF001
    assert coordinator._watch_uid_state["watch"] == (fingerprint, 9, 100)  # noqa: SLF001

    client.matching_uids.side_effect = None
    client.matching_uids.return_value = {"101"}
    retry_arrivals = await coordinator._async_detect_folder_new_emails(  # noqa: SLF001
        client,
        "Receipts",
        status,
        fetch_messages=True,
    )
    retry_floors = coordinator._prepare_watch_uid_floors(  # noqa: SLF001
        {"Receipts": status}
    )
    matches = await coordinator._async_match_new_messages(  # noqa: SLF001
        client,
        {"Receipts": retry_arrivals},
        watch_uid_floors=retry_floors,
    )

    assert [(watch_id, message["uid"]) for watch_id, message in matches] == [
        ("watch", "101")
    ]
    assert coordinator._folder_uid_state["Receipts"] == (9, 101)  # noqa: SLF001
    assert coordinator._watch_uid_state["watch"] == (fingerprint, 9, 101)  # noqa: SLF001
    assert client.get_new_emails.await_count == 2
'''
          if "test_watch_match_failure_retries_unacknowledged_arrival" in tests:
              raise SystemExit("regression test already exists")
          test_path.write_text(tests + regression)

          Path(".github/workflows/apply-watch-baseline-fix.yml").unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/email_ha/coordinator.py tests/test_catch_up.py .github/workflows/apply-watch-baseline-fix.yml
          git commit -m "fix: retry watch arrivals after transient match failure"
          git push
