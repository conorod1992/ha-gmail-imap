name: Apply secondary watch refresh fix

on:
  push:
    branches:
      - fix/secondary-watch-refresh

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/secondary-watch-refresh
      - name: Apply code and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/email_ha/coordinator.py')
          text = path.read_text()
          text = text.replace(
              '_FOLDER_REFRESH_INTERVAL = 86400\n_CATCH_UP_MARKER = "_email_ha_caught_up"\n',
              '_FOLDER_REFRESH_INTERVAL = 86400\n_SECONDARY_WATCH_REFRESH_INTERVAL = 60\n_CATCH_UP_MARKER = "_email_ha_caught_up"\n',
          )
          marker = 'def watch_definition_fingerprint(definition: dict[str, Any]) -> str:\n'
          helper = '''def _coordinator_refresh_interval(\n    monitored_folder: str, email_watches: list[dict[str, Any]]\n) -> timedelta:\n    """Return a shorter fallback interval when IDLE cannot cover every watch."""\n    has_secondary_watch = any(\n        watch.get("enabled", True)\n        and str(watch.get("folder", DEFAULT_FOLDER)) != monitored_folder\n        for watch in email_watches\n    )\n    seconds = (\n        _SECONDARY_WATCH_REFRESH_INTERVAL\n        if has_secondary_watch\n        else IDLE_FALLBACK_REFRESH_INTERVAL\n    )\n    return timedelta(seconds=seconds)\n\n\n'''
          text = text.replace(marker, helper + marker)
          text = text.replace(
              '            update_interval=timedelta(seconds=IDLE_FALLBACK_REFRESH_INTERVAL),\n',
              '            update_interval=_coordinator_refresh_interval(\n                folder, self.email_watches\n            ),\n',
          )
          path.write_text(text)

          Path('tests/test_secondary_watch_refresh.py').write_text('''"""Tests for secondary-folder Email Watch refresh cadence."""\n\nfrom datetime import timedelta\n\nfrom custom_components.email_ha.coordinator import _coordinator_refresh_interval\n\n\ndef test_default_refresh_interval_without_secondary_watch() -> None:\n    """Normal monitored-folder setups keep the existing 15-minute fallback."""\n    watches = [\n        {"id": "inbox", "folder": "INBOX", "enabled": True},\n        {"id": "paused", "folder": "Receipts", "enabled": False},\n    ]\n\n    assert _coordinator_refresh_interval("INBOX", watches) == timedelta(minutes=15)\n\n\ndef test_secondary_watch_uses_one_minute_fallback() -> None:\n    """An enabled watch outside the IDLE folder gets a near-real-time poll fallback."""\n    watches = [\n        {"id": "inbox", "folder": "INBOX", "enabled": True},\n        {"id": "receipts", "folder": "Receipts", "enabled": True},\n    ]\n\n    assert _coordinator_refresh_interval("INBOX", watches) == timedelta(minutes=1)\n\n\ndef test_default_folder_is_secondary_when_monitoring_another_folder() -> None:\n    """A watch using the default INBOX is secondary if another folder is monitored."""\n    watches = [{"id": "inbox", "enabled": True}]\n\n    assert _coordinator_refresh_interval("Receipts", watches) == timedelta(minutes=1)\n''')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/email_ha/coordinator.py tests/test_secondary_watch_refresh.py
          git commit -m "fix: refresh secondary email watches promptly"
          git push
# trigger
