name: Apply match mode implementation

on:
  push:
    branches:
      - feature/match-all-any-filters

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/match-all-any-filters
      - name: Apply implementation
        shell: python
        run: |
          from __future__ import annotations

          import json
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1))

          search_path = "custom_components/email_ha/search.py"
          replace_one(
              search_path,
              'RELATIVE_DATE_RANGES = (\n    "any",\n    "today",\n    "yesterday",\n    "last_24_hours",\n    "last_7_days",\n    "last_30_days",\n)\n',
              'RELATIVE_DATE_RANGES = (\n    "any",\n    "today",\n    "yesterday",\n    "last_24_hours",\n    "last_7_days",\n    "last_30_days",\n)\nMATCH_MODES = ("all", "any")\n',
          )
          replace_one(
              search_path,
              '    normalized = normalize_structured_filters(filters)\n    details: list[str] = []\n',
              '    normalized = normalize_structured_filters(filters)\n    match_any = normalized.get("match_mode") == "any"\n    details: list[str] = []\n',
          )
          replace_one(
              search_path,
              '    if not details:\n        return "All email"\n    if short and len(details) > 4:\n        return " · ".join(details[:4]) + f" · +{len(details) - 4} more"\n    return " · ".join(details)\n',
              '    if not details:\n        return "All email"\n    prefix = "Match any condition · " if match_any else ""\n    if short and len(details) > 4:\n        return prefix + " · ".join(details[:4]) + f" · +{len(details) - 4} more"\n    return prefix + " · ".join(details)\n',
          )
          replace_one(
              search_path,
              'def normalize_structured_filters(filters: Mapping[str, Any]) -> dict[str, Any]:\n    """Return populated structured filters in a response-safe form."""\n    normalized: dict[str, Any] = {}\n',
              'def normalize_structured_filters(filters: Mapping[str, Any]) -> dict[str, Any]:\n    """Return populated structured filters in a response-safe form."""\n    normalized: dict[str, Any] = {}\n    match_mode = filters.get("match_mode", "all")\n    if match_mode not in MATCH_MODES:\n        raise ValueError("Invalid match_mode")\n    if match_mode != "all":\n        normalized["match_mode"] = match_mode\n',
          )
          replace_one(
              search_path,
              '    normalized = normalize_structured_filters(filters)\n    tokens: list[str] = []\n',
              '    normalized = normalize_structured_filters(filters)\n    if normalized.pop("match_mode", "all") == "any":\n        clauses = [\n            build_structured_search_tokens(\n                {field: value}, current_date=current_date\n            )\n            for field, value in normalized.items()\n        ]\n        if not clauses:\n            return ["ALL"]\n        if len(clauses) == 1:\n            return clauses[0]\n\n        def grouped(clause: Sequence[str]) -> str:\n            return clause[0] if len(clause) == 1 else f"({\' \'.join(clause)})"\n\n        combined = clauses[-1]\n        for clause in reversed(clauses[:-1]):\n            combined = ["OR", grouped(clause), grouped(combined)]\n        return validate_search_tokens(combined)\n\n    tokens: list[str] = []\n',
          )

          config_path = "custom_components/email_ha/config_flow.py"
          replace_one(
              config_path,
              '    IMPORTANT_STATES,\n    READ_STATES,\n',
              '    IMPORTANT_STATES,\n    MATCH_MODES,\n    READ_STATES,\n',
          )
          replace_one(
              config_path,
              '_COMMON_FILTER_FIELDS = (\n    "from",\n',
              '_COMMON_FILTER_FIELDS = (\n    "match_mode",\n    "from",\n',
          )
          replace_one(
              config_path,
              '        vol.Required(\n            CONF_FOLDER, default=values.get(CONF_FOLDER, DEFAULT_FOLDER)\n        ): _folder_selector(folders),\n        vol.Optional("from", default=filters.get("from", "")): selector.TextSelector(),\n',
              '        vol.Required(\n            CONF_FOLDER, default=values.get(CONF_FOLDER, DEFAULT_FOLDER)\n        ): _folder_selector(folders),\n        vol.Required("match_mode", default=filters.get("match_mode", "all")): _select(\n            MATCH_MODES, "match_mode"\n        ),\n        vol.Optional("from", default=filters.get("from", "")): selector.TextSelector(),\n',
          )

          init_path = "custom_components/email_ha/__init__.py"
          replace_one(
              init_path,
              '    IMPORTANT_STATES,\n    READ_STATES,\n',
              '    IMPORTANT_STATES,\n    MATCH_MODES,\n    READ_STATES,\n',
          )
          replace_one(
              init_path,
              '        vol.Optional(SERVICE_ATTR_FOLDER, default=DEFAULT_FOLDER): vol.All(\n            cv.string, validate_imap_folder\n        ),\n        vol.Optional("from"): cv.string,\n',
              '        vol.Optional(SERVICE_ATTR_FOLDER, default=DEFAULT_FOLDER): vol.All(\n            cv.string, validate_imap_folder\n        ),\n        vol.Optional("match_mode", default="all"): vol.In(MATCH_MODES),\n        vol.Optional("from"): cv.string,\n',
          )

          services_path = "custom_components/email_ha/services.yaml"
          replace_one(
              services_path,
              '    Find emails with friendly filters. Blank filters are ignored and all filled\n    conditions must match. Gmail performs the search on its server.\n',
              '    Find emails with friendly filters. Blank filters are ignored. Choose whether\n    all filled conditions or any filled condition must match. Gmail performs the search on its server.\n',
          )
          replace_one(
              services_path,
              '    from:\n      name: From contains\n',
              '    match_mode:\n      name: Match\n      description: Require all filled conditions to match, or allow any one filled condition to match.\n      default: all\n      selector:\n        select:\n          options:\n            - label: All conditions\n              value: all\n            - label: Any condition\n              value: any\n    from:\n      name: From contains\n',
          )

          for json_path in (
              "custom_components/email_ha/strings.json",
              "custom_components/email_ha/translations/en.json",
          ):
              path = Path(json_path)
              data = json.loads(path.read_text())
              steps = data["options"]["step"]
              common = steps["custom_sensor_common"]
              common["description"] = (
                  "Only the number of matching emails is retrieved. Matching is performed by Gmail; "
                  "message contents are not downloaded for this sensor. Blank filters are ignored; "
                  "choose whether all filled conditions or any filled condition must match. Current rule: {summary}."
              )
              common["data"]["match_mode"] = "Match"
              common.setdefault("data_description", {})["match_mode"] = (
                  "All conditions requires every filled filter to match. Any condition matches when at least one filled filter matches."
              )
              steps["custom_sensor_advanced"]["description"] = (
                  "These optional conditions use the Match choice from the previous screen. Body and text matching happen on Gmail's server "
                  "without downloading message bodies into Home Assistant. Choose either a relative date or exact date filters, not both. Current rule: {summary}."
              )
              watch = steps["email_watch_common"]
              watch["description"] = (
                  "Fires an event when Email HA observes an arriving message that satisfies the selected Match rule. Catch-up is optional and bounded; "
                  "message bodies are never included in watch events. Current rule: {summary}."
              )
              watch["data"]["match_mode"] = "Match"
              watch.setdefault("data_description", {})["match_mode"] = (
                  "All conditions requires every filled filter to match. Any condition matches when at least one filled filter matches."
              )
              steps["email_watch_advanced"]["description"] = (
                  "These optional conditions use the Match choice from the previous screen. Choose either a relative date or exact date filters, not both. Current rule: {summary}."
              )
              data["selector"]["match_mode"] = {
                  "options": {"all": "All conditions", "any": "Any condition"}
              }
              data["services"]["find_emails"]["description"] = (
                  "Find emails with friendly filters. Blank filters are ignored; choose whether all filled conditions or any filled condition must match."
              )
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")

          readme_path = "README.md"
          replace_one(
              readme_path,
              'The first form contains common filters, including attachment presence. Turn on Add more filters for To, CC, body text, any text, attachment filename, and date filters. Blank fields are ignored and all filled conditions must match.\n',
              'The first form contains common filters, including attachment presence. Turn on Add more filters for To, CC, body text, any text, attachment filename, and date filters. Blank fields are ignored. Choose **All conditions** for the existing AND behaviour, or **Any condition** when one filled filter is enough to match.\n',
          )
          replace_one(
              readme_path,
              '`email_ha.find_emails` is the normal action. It provides friendly From, To, CC, Subject, Body, Any text, read, starred, importance, category, and date fields. Blank filters are ignored; filled filters combine with AND.\n',
              '`email_ha.find_emails` is the normal action. It provides friendly From, To, CC, Subject, Body, Any text, read, starred, importance, category, and date fields. Blank filters are ignored. `match_mode` defaults to `all` for the existing AND behaviour; set it to `any` to match when at least one filled condition is true.\n',
          )
          replace_one(
              readme_path,
              '      from: rsa.ie\n      subject: renewal\n      read_state: unread\n',
              '      from: rsa.ie\n      subject: renewal\n      read_state: unread\n',
          )

          manifest_path = Path("custom_components/email_ha/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          if manifest.get("version") != "2.4.0":
              raise RuntimeError(f"Unexpected manifest version: {manifest.get('version')}")
          manifest["version"] = "2.5.0"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          test_path = Path("tests/test_match_mode.py")
          test_path.write_text('''"""Tests for Match all / Match any structured filters."""\n\nfrom __future__ import annotations\n\nfrom datetime import date\n\nimport pytest\n\nfrom custom_components.email_ha import FIND_EMAILS_SCHEMA\nfrom custom_components.email_ha.config_flow import _custom_common_schema\nfrom custom_components.email_ha.search import (\n    build_structured_search_tokens,\n    normalize_structured_filters,\n    summarize_structured_filters,\n)\n\n\ndef test_legacy_filters_still_default_to_all() -> None:\n    assert build_structured_search_tokens({"from": "rsa.ie", "subject": "renewal"}) == [\n        "FROM",\n        '"rsa.ie"',\n        "SUBJECT",\n        '"renewal"',\n    ]\n\n\ndef test_match_any_builds_nested_imap_or() -> None:\n    assert build_structured_search_tokens(\n        {"match_mode": "any", "from": "rsa.ie", "subject": "check test"}\n    ) == [\n        "OR",\n        '(FROM "rsa.ie")',\n        '(SUBJECT "check test")',\n    ]\n\n\ndef test_match_any_handles_single_token_and_gmail_extension() -> None:\n    assert build_structured_search_tokens(\n        {"match_mode": "any", "read_state": "unread", "gmail_category": "primary"}\n    ) == [\n        "OR",\n        "UNSEEN",\n        '(X-GM-RAW "category:primary")',\n    ]\n\n\ndef test_match_any_keeps_multi_key_date_window_as_one_condition() -> None:\n    tokens = build_structured_search_tokens(\n        {"match_mode": "any", "relative_date": "yesterday", "from": "rsa.ie"},\n        current_date=date(2026, 8, 27),\n    )\n    assert tokens == [\n        "OR",\n        '(FROM "rsa.ie")',\n        '(SINCE 26-Aug-2026 BEFORE 27-Aug-2026)',\n    ]\n\n\ndef test_match_any_with_no_filled_filters_remains_all_email() -> None:\n    assert build_structured_search_tokens({"match_mode": "any"}) == ["ALL"]\n\n\ndef test_invalid_match_mode_is_rejected() -> None:\n    with pytest.raises(ValueError, match="match_mode"):\n        normalize_structured_filters({"match_mode": "some"})\n\n\ndef test_match_any_is_visible_in_summary() -> None:\n    summary = summarize_structured_filters(\n        {"match_mode": "any", "from": "rsa.ie", "subject": "renewal"},\n        folder="INBOX",\n    )\n    assert summary.startswith("Match any condition · Inbox")\n\n\ndef test_find_emails_schema_accepts_match_any() -> None:\n    values = FIND_EMAILS_SCHEMA({"match_mode": "any"})\n    assert values["match_mode"] == "any"\n\n\ndef test_options_common_form_exposes_match_mode() -> None:\n    schema = _custom_common_schema(["INBOX"], {})\n    field_names = {getattr(field, "schema", field) for field in schema.schema}\n    assert "match_mode" in field_names\n''')

          print("Applied Match all / Match any implementation")
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Validate implementation
        run: |
          pytest -q
          ruff check .
          ruff format --check .
          pyright
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md custom_components tests
          git commit -m "feat: support match all or any filters"
          git push origin HEAD:feature/match-all-any-filters
