name: Apply match mode implementation v3

on:
  push:
    branches:
      - feature/match-all-any-filters

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/match-all-any-filters
      - name: Apply implementation from prepared workflow
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-match-mode-v2.yml').read_text()
          marker = '      - name: Apply implementation\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('      - name: Install test dependencies\n', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'match_mode_patch.py', 'exec'))
      - name: Format changed Python files
        run: |
          python -m pip install ruff
          ruff format custom_components tests
          ruff check custom_components tests
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md custom_components tests
          git commit -m "feat: support match all or any filters"
          git push origin HEAD:feature/match-all-any-filters
